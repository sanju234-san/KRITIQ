[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kritiq-cli"
version = "2.4.12"
description = "KRITIQ AI-powered code review and translation CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.28.0",
    "python-dotenv>=0.21.0"
]

[project.scripts]
kritiq = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "ai_agent*"]
